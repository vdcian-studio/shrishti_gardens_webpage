<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <!-- Botanical Mountain Emblem -->
  <g transform="translate(10, 6)">
    <!-- Outer Shield / Halo Accent -->
    <circle cx="24" cy="24" r="22" stroke="#C5A66A" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="2 3"/>
    <circle cx="24" cy="24" r="20" stroke="#C5A66A" stroke-width="0.8" stroke-opacity="0.9"/>
    
    <!-- Stylized Mountain & Pine Flora Silhouette -->
    <!-- Center Mountain Peak -->
    <path d="M24 10 L33 26 H15 Z" fill="none" stroke="#C5A66A" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Overlapping Sacred Hill Peak -->
    <path d="M18 19 L25 31 H11 Z" fill="none" stroke="#C5A66A" stroke-width="0.9" stroke-linejoin="round" stroke-opacity="0.7"/>
    <!-- Rising Sun / Morning Dew -->
    <circle cx="24" cy="16" r="1.8" fill="#C5A66A"/>
    <!-- Botanical Flora Fronds -->
    <path d="M24 38 C24 33 29 30 34 30 C30 33 27 36 24 38 Z" fill="#C5A66A"/>
    <path d="M24 38 C24 33 19 30 14 30 C18 33 21 36 24 38 Z" fill="#C5A66A"/>
    <line x1="24" y1="28" x2="24" y2="39" stroke="#C5A66A" stroke-width="1.2"/>
  </g>

  <!-- Typography: SHRISHTI GARDENS -->
  <text x="68" y="27" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" font-weight="500" letter-spacing="4" fill="#F5F1E8">SHRISHTI</text>
  <text x="68" y="44" font-family="'Manrope', sans-serif" font-size="9.5" font-weight="400" letter-spacing="6" fill="#C5A66A">GARDENS</text>
  <text x="188" y="44" font-family="'Manrope', sans-serif" font-size="7.5" font-weight="300" letter-spacing="3" fill="#A3B8B0">· KODAIKANAL</text>
</svg>
